name: Bug Report
description: Bug reports concern reproducible behavior which contravenes the documented behaviour.
labels: ["triage"]
assignees:
  - nikosdion
body:
  - type: markdown
    attributes:
      value: "## The Basics"
  - type: checkboxes
    id: basic-checks
    attributes:
      label: Due diligence
      description: Please make sure you have performed all of the following due diligence checks, and mark the respective boxes.
      options:
        - label: I have searched all open and closed issues for this problem.
          required: true
        - label: I have looked at the CHANGELOG to make sure this problem has not already been addressed.
          required: true
        - label: I agree to the Code of Conduct of this repository
          required: true
  - type: dropdown
    id: ai
    attributes:
      label: Use of AI
      description: Did you use generative AI when researching or submitting this issue?
      options:
        - None
        - AI chatbot (e.g. ChatGPT)
        - AI code assistant
    validations:
      required: true
  - type: markdown
    attributes:
      value: "## Issue Description"
  - type: textarea
    id: description
    attributes:
      label: Executive summary
      description: A summary of the bug in 100 words or less.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction instructions
      description: Provide step-by-step instructions to reproduce the unwanted behaviour.
      value: |
        1. Go to …
        2. Click on …
        3. Scroll down to …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect would happen following the Reproduction Instructions above?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happens when following the Reproduction Instructions above?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false
  - type: markdown
    attributes:
      value: "## Environment information"
  - type: input
    id: grafida_version
    attributes:
      label: Grafida version
      placeholder: e.g. 1.2.3
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS version
      placeholder: e.g. Windows 11 26H1, Arch Linux, Ubuntu Desktop 26.04
    validations:
      required: true
  - type: input
    id: joomla_version
    attributes:
      label: Joomla! version
      placeholder: e.g. 6.1.2
    validations:
      required: false
  - type: markdown
    attributes:
      value: "## Additional context"
  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: If applicable, any additional information to help us understand your issue, or pertinent information for which there are no fields available.
    validations:
      required: false
